# Read access to a generated dataset record table. The table is produced outside this
# repository by t4dataset-generator, carries its own splits and database names, and is
# shared by every model that trains on these databases. The path is fixed: mount your
# own writable records directory at /workspace/records, so the data mount can stay read
# only.
_target_: autoware_ml.databases.record_table.RecordTable
_convert_: all

path: /workspace/records/t4dataset.parquet
data_root: ${data_root_path}/t4dataset/

# Databases of the table this corpus trains on. db_j6gen2_v9 to v12 and
# db_largebus_v3 are on the data mount but have no database config in
# t4dataset-generator yet, so no table holds them.
databases:
  - db_jpntaxigen2_v1
  - db_jpntaxigen2_v2
  - db_j6gen2_v1
  - db_j6gen2_v2
  - db_j6gen2_v3
  - db_j6gen2_v4
  - db_j6gen2_v5
  - db_j6gen2_v6
  - db_j6gen2_v7
  - db_j6gen2_v8
  - db_largebus_v1
  - db_largebus_v2
