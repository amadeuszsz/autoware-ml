# Read access to a generated dataset record table. The table is produced outside this
# repository by t4dataset-generator, carries its own splits and database names, and is
# shared by every model that trains on these databases. The path is fixed: mount your
# own writable records directory at /workspace/records, so the data mount can stay read
# only.
_target_: autoware_ml.databases.record_table.RecordTable
_convert_: all

path: /workspace/records/nuscenes.parquet
data_root: ${data_root_path}/nuscenes/

# Databases of the table this corpus trains on.
databases:
  - v1.0-trainval
