# @package _global_
defaults:
  - ../base
  - /metrics/t4dataset/detection3d/default_detection3d_metrics
  - /metrics/t4dataset/segmentation3d/default_segmentation3d_metrics
  - /metrics/t4dataset/det3d_seg3d/default_det3d_seg3d_metrics
  - /metrics/t4dataset/detection3d@detection3d_metrics: default_detection3d_metric_suites
  - /metrics/t4dataset/segmentation3d@segmentation3d_metrics: default_segmentation3d_metric_suites
  - /metrics/t4dataset/det3d_seg3d@det3d_seg3d_metrics: default_det3d_seg3d_metric_suites
  - /metrics/t4dataset/tracking@tracking_metrics: default_tracking_metric_suites
  - /metrics/t4dataset/detection3d@metric_ranges: default_detection3d_120m_metric_ranges
  - /datamodule@datamodule: t4dataset/default_det3d_seg3d_datamodule
  - /datamodule/streaming@datamodule: default_streaming_datamodule
  - /database/t4dataset/taxonomy@taxonomy: ???
  - /ego@ego: ???
  - _self_

# Detection classes first and in the same order, so both tasks share their indices
taxonomy:
  detection3d:
    class_names:
      - car
      - truck
      - bus
      - motorcycle
      - bicycle
      - pedestrian
      - animal
      - barrier
      - traffic_cone
      - debris
  segmentation3d:
    class_names:
      - car
      - truck
      - bus
      - motorcycle
      - bicycle
      - pedestrian
      - animal
      - barrier
      - traffic_cone
      - debris
      - driveable_flat
      - non_driveable_flat
      - vegetation
      - manmade
      - vertical_thin
      - noise

point_cloud_range: [-122.88, -122.88, -2.30, 122.88, 122.88, 5.38]
# Dense scenes hold up to a few hundred boxes, so the queries and outputs are sized above them.
num_anchor: 1800

# The detection, segmentation and joint suites, then detection on the boxes observed in the
# stream so far and the tracks.
metrics: ${merge_lists:${detection3d_metrics},${segmentation3d_metrics},${det3d_seg3d_metrics},${tracking_metrics}}

# Boxes carrying one of these (class, attribute) pairs are dropped from training and evaluation.
filter_attributes:
  - [bicycle, vehicle_state.parked]
  - [bicycle, two_wheel_vehicle_state.without_rider]
  - [bicycle, cycle_state.without_rider]
  - [motorcycle, vehicle_state.parked]
  - [motorcycle, two_wheel_vehicle_state.without_rider]
  - [motorcycle, cycle_state.without_rider]
  - [motorcycle, motorcycle_state.without_rider]

model:
  bbox_head:
    num_output: 500
    # The memory of the last frame, timed in seconds so it holds at any frame rate
    num_temp_instances: 1200
    default_time_interval: 0.1
    # A gap below half the 10 Hz period is not a frame interval
    min_time_interval: 0.05
    max_time_interval: 2.0
    # Sparse4D decays by 0.6 per frame at 2 Hz, about 0.36 per second
    confidence_decay: 0.36
    dn_query_budget: 400
    # An instance becomes a target once it holds 2 points in a frame of the stream
    min_observed_points: 2
    track_birth_score: 0.2
    # The 0.96 m stage projected onto a BEV map and encoded as the TransFusion neck does,
    # sampled at the keypoints' (x, y) next to the sparse voxels
    lidar_sampling: sparse_bev
    bev_channels: 128
    bev:
      _target_: autoware_ml.models.detection3d.ptv3.PTv3StageBEVPyramid
      point_cloud_range: ${point_cloud_range}
      grid_size: ${grid_size}
      stage_strides: ${det_feature_strides}
      projected_strides: [8]
      in_channels: ${model.det_fusion.out_channels}
      channels: ${model.bbox_head.bev_channels}
      bev_encoder:
        _target_: autoware_ml.models.detection3d.ptv3.PTv3BEVEncoder
        in_channels: ${model.bbox_head.bev_channels}
        hidden_channels: ${model.bbox_head.bev_channels}
        out_channels: ${model.bbox_head.bev_channels}
        dilations: [1, 2, 5, 2]
      num_downsampled: 0

# Mild augmentation and no min-points filter, the instance bank carries occluded boxes. The point
# counts of the served frame decide when an instance is observed.
datasets:
  train:
    transforms:
      _target_: autoware_ml.transforms.base.TransformsCompose
      _convert_: all

      pipeline:
        - _target_: autoware_ml.transforms.point_cloud.loading.LoadPointsFromFile
          _convert_: all

          use_dim: [0, 1, 2, 3] # Refer PointFieldIndex for the name of each dimensionality, [x, y, z, intensity]
          bev_remove_radius: 0.0

        - _target_: autoware_ml.transforms.camera_lidar.geometry.GlobalRotScaleTrans
          _convert_: all

          yaw_rot_range: [-0.3925, 0.3925]
          scale_ratio_range: [0.95, 1.05]
          translation_std: [0.2, 0.2, 0.1]

        - _target_: autoware_ml.transforms.point_cloud.perturbation.RandomJitter
          _convert_: all

          sigma: 0.012
          clip: 0.05

        - _target_: autoware_ml.transforms.point_cloud.geometry.PointsRangeFilter
          _convert_: all

          points_range: ${point_cloud_range}

        # Milder dropout keeps the few points of thin objects such as riders and two-wheelers
        - _target_: autoware_ml.transforms.point_cloud.sampling.RandomDropout
          _convert_: all

          probability: 0.25
          dropout_ratio: 0.1

        - _target_: autoware_ml.transforms.point_cloud.perturbation.RandomStrengthJitter
          _convert_: all

          gamma_range: [0.8, 1.25]
          scale_range: [0.9, 1.1]
          shift_range: [-0.02, 0.02]

        # Boxes are served as stored: a non finite velocity is zeroed (unannotated, at rest)
        # and boxes whose geometry cannot become a target are dropped.
        - _target_: autoware_ml.transforms.boxes3d.filters.BBoxesPhysicalFilter
          _convert_: all

          max_absolute_speed: 150.0 # m/s, 540 km/h

        - _target_: autoware_ml.transforms.boxes3d.filters.BBoxesIgnoreIndexFilter
          _convert_: all

          ignore_index: ${taxonomy.detection3d.ignore_index}

        - _target_: autoware_ml.transforms.boxes3d.filters.BBoxesAttributeFilter
          _convert_: all

          filter_attributes: ${filter_attributes}

        - _target_: autoware_ml.transforms.boxes3d.filters.BBoxesRangeFilter
          _convert_: all

          point_cloud_range: ${point_cloud_range}

        - _target_: autoware_ml.transforms.boxes3d.filters.BBoxesPointCount

  test:
    transforms:
      _target_: autoware_ml.transforms.base.TransformsCompose
      _convert_: all

      pipeline:
        - _target_: autoware_ml.transforms.point_cloud.loading.LoadPointsFromFile
          _convert_: all

          use_dim: [0, 1, 2, 3] # Refer PointFieldIndex for the name of each dimensionality, [x, y, z, intensity]
          bev_remove_radius: 0.0

        - _target_: autoware_ml.transforms.point_cloud.geometry.PointsRangeFilter
          _convert_: all

          points_range: ${point_cloud_range}

        # Boxes are served as stored: a non finite velocity is zeroed (unannotated, at rest)
        # and boxes whose geometry cannot become a target are dropped.
        - _target_: autoware_ml.transforms.boxes3d.filters.BBoxesPhysicalFilter
          _convert_: all

          max_absolute_speed: 150.0 # m/s, 540 km/h

        - _target_: autoware_ml.transforms.boxes3d.filters.BBoxesIgnoreIndexFilter
          _convert_: all

          ignore_index: ${taxonomy.detection3d.ignore_index}

        - _target_: autoware_ml.transforms.boxes3d.filters.BBoxesAttributeFilter
          _convert_: all

          filter_attributes: ${filter_attributes}

        - _target_: autoware_ml.transforms.boxes3d.filters.BBoxesRangeFilter
          _convert_: all

          point_cloud_range: ${point_cloud_range}

datamodule:
  predict_dataloader:
    batch_size: 1

callbacks:
  early_stopping: null
