# @package _global_

# Teacher variant of the joint model for pseudo labeling and distillation, never deployed. The
# encoder and the segmentation decoder follow the PT-v3m3 architecture, the database is bound
# to the offline taxonomy with trailer as a class of its own, and the BEV head geometry is
# scaled to the 5 cm grid. The train pipeline is restated to scale the jitter to the grid.

defaults:
  - /tasks/multi/ptv3/voxel012_122m_t4dataset_j6gen2
  - override /database/t4dataset/box3d_pipelines@database.box3d_pipelines: trailer_class_box3d_pipelines
  - override /database/t4dataset/taxonomy@database.taxonomy: offline
  - _self_

grid_size: 0.05
max_voxels: 1200000
head_voxel_size: [0.4, 0.4, 8.0]

batch_size: 1

model:
  # PT-v3m3 encoder and segmentation decoder, checkpoint compatible with the seg3d stage
  encoder:
    enc_depths: [3, 3, 3, 12, 3]
    enc_channels: [54, 108, 216, 432, 576]
    enc_num_head: [3, 6, 12, 24, 32]
    enc_patch_size: [1024, 1024, 1024, 1024, 1024]
  seg3d_head:
    dec_depths: [2, 2, 2, 2]
    dec_channels: [54, 108, 216, 432]
    dec_num_head: [3, 6, 12, 24]
    dec_patch_size: [1024, 1024, 1024, 1024]
  bev_neck:
    # Wider detection branch than the deployed model, the teacher has no latency budget
    fusion:
      out_channels: 512
    bev_projector:
      out_channels: 256
      output_shape: [615, 615]
    bev_encoder:
      hidden_channels: 256
      out_channels: 256
      # Dilations scaled with the BEV cell so the receptive field keeps a 20 m radius
      dilations: [2, 5, 12, 5]
  bbox_head:
    in_channels: 256
    hidden_channel: 256
    feedforward_channels: 512
    # Local maximum window scaled with the BEV cell to keep a 2.8 m window
    nms_kernel_size: 7
    # Heatmap pooling over the fine constituents of car, truck and bus
    dense_heatmap_pooling_classes:
      [car, truck, trailer, bus, construction_vehicle, emergency_vehicle,
       forklift, other_vehicle]
    # Large vehicles suppress each other, the remaining classes take per class top-k caps
    nms_groups:
      - class_names:
          [car, truck, trailer, bus, train, construction_vehicle,
           emergency_vehicle, forklift, other_vehicle]
        nms_radius: 0.25
        post_max_size: 300
      - class_names: [motorcycle]
        nms_radius: 0.0
        post_max_size: 50
      - class_names: [bicycle]
        nms_radius: 0.0
        post_max_size: 50
      - class_names: [pedestrian]
        nms_radius: 0.0
        post_max_size: 100
      - class_names: [personal_mobility]
        nms_radius: 0.0
        post_max_size: 50
      - class_names: [animal]
        nms_radius: 0.0
        post_max_size: 50
      - class_names: [barrier]
        nms_radius: 0.0
        post_max_size: 50
      - class_names: [construction_sign]
        nms_radius: 0.0
        post_max_size: 50
      - class_names: [traffic_cone]
        nms_radius: 0.0
        post_max_size: 100
      - class_names: [debris]
        nms_radius: 0.0
        post_max_size: 50
      - class_names: [pushable_pullable]
        nms_radius: 0.0
        post_max_size: 50
      - class_names: [bicycle_rack]
        nms_radius: 0.0
        post_max_size: 50
      - class_names: [open_door]
        nms_radius: 0.0
        post_max_size: 50
      - class_names: [vehicle_protruding_object]
        nms_radius: 0.0
        post_max_size: 50
    bbox_coder:
      # The teacher decodes everything, no per class score threshold
      score_threshold: 0.0

trainer:
  precision: 32-true
  accumulate_grad_batches: 8
  # BatchNorm statistics pooled across ranks, one scene per GPU is too few
  sync_batchnorm: true

datamodule:
  train_transforms:
    _target_: autoware_ml.transforms.base.TransformsCompose
    pipeline:
      - _target_: autoware_ml.transforms.boxes3d.loading.LoadDet3DAnnotations
        class_names: ${dataset.detection3d.class_names}
        ignore_label_index: ${dataset.detection3d.ignore_index}
        filter_attributes: ${dataset.detection3d.filter_attributes}
      - _target_: autoware_ml.transforms.point_cloud.sweeps.LoadPointsFromMultiSweeps
        sweeps_num: 2
        use_features: [x, y, z, intensity, timestamp_difference]
        remove_close: true
        sweep_selection: random
        time_lag_range: [0.05, 0.25]
      - _target_: autoware_ml.transforms.segmentation3d.loading.LoadSeg3DAnnotations
        taxonomy: ${database.taxonomy.segmentation3d}
      - _target_: autoware_ml.transforms.point_cloud.formatting.PreparePointCloudInput
        require_time_lag: true
      - _target_: autoware_ml.transforms.point_cloud.geometry.RandomRotateTargetAngle
        p: 0.75
        angle: [0.5, 1.0, 1.5]
        center: [0.0, 0.0, 0.0]
      - _target_: autoware_ml.transforms.point_cloud.geometry.GlobalRotScaleTrans
        rot_range: [-1.57079633, 1.57079633]
        scale_ratio_range: [0.9, 1.1]
        translation_std: [0.5, 0.5, 0.2]
      - _target_: autoware_ml.transforms.point_cloud.geometry.RandomFlip3D
        flip_ratio_bev_horizontal: 0.5
        flip_ratio_bev_vertical: 0.5
      - _target_: autoware_ml.transforms.point_cloud.perturbation.RandomJitter
        sigma: 0.005
        clip: 0.02
      - _target_: autoware_ml.transforms.point_cloud.crop.PointsRangeFilter
        point_cloud_range: ${point_cloud_range}
      - _target_: autoware_ml.transforms.point_cloud.sampling.RandomDropout
        p: 0.5
        dropout_ratio: 0.2
      - _target_: autoware_ml.transforms.point_cloud.perturbation.RandomStrengthJitter
        gamma_range: [0.8, 1.25]
        scale_range: [0.9, 1.1]
        shift_range: [-0.02, 0.02]
      - _target_: autoware_ml.transforms.boxes3d.filters.ObjectRangeFilter
        point_cloud_range: ${point_cloud_range}
      - _target_: autoware_ml.transforms.boxes3d.filters.ObjectRangeMinPointsFilter
        range_radius: [0.0, 60.0]
        min_num_points: ${dataset.detection3d.train_min_points_near}
      - _target_: autoware_ml.transforms.boxes3d.filters.ObjectRangeMinPointsFilter
        range_radius: [60.0, 130.0]
        min_num_points: ${dataset.detection3d.train_min_points_far}
      - _target_: autoware_ml.transforms.common.packing.BuildPointFeatures
        feature_names: [x, y, z, intensity, timestamp_difference]
