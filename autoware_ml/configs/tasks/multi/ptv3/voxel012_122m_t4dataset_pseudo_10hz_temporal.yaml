# @package _global_

# PTv3 segmentation and temporal Sparse4D detection on 10 Hz J6 gen2 and JPN taxi gen2 streams.

defaults:
  - /tasks/multi/ptv3/base_sparse4d
  - /datasets/t4dataset/detection3d
  - /datasets/t4dataset/segmentation3d
  - /datasets/t4dataset/segdet3d: default_coarse
  - /datasets/t4dataset/lidar
  - /database@database: t4dataset/t4dataset_pseudo_10hz_j6gen2
  - /database@jpntaxi_database: t4dataset/t4dataset_pseudo_10hz_jpntaxi
  - /datamodule@datamodule: t4dataset/default_segdet3d_datamodule
  - _self_

dataset: ${t4dataset}

point_cloud_range: [-122.88, -122.88, -2.30, 122.88, 122.88, 5.38]
max_voxels: 524288
grid_size: 0.12

batch_size: 8
num_workers: 8

# Dense scenes hold up to a few hundred boxes, so the queries and outputs are sized above them
num_anchor: 1800

# The queries sample the 0.24, 0.48 and 0.96 m stages, all fused top-down from the deepest one
det_feature_strides: [2, 4, 8]

# TODO(amadeuszsz): restore db_jpntaxi_v1 once its LIDAR_CONCAT packs name their frames like the
# annotations do (they hold 00000.pcd.bin, ... instead of 0.pcd.bin, 0-01.pcd.bin, ...)
jpntaxi_database:
  scenarios:
    db_pseudo_10hz_jpntaxi:
      dataset_params:
        - _target_: autoware_ml.databases.scenarios.DatasetParams
          _convert_: all
          dataset_name: db_jpntaxigen2_v1
          max_past_sweeps: 2
          max_future_sweeps: 0
          sample_steps: 1
        - _target_: autoware_ml.databases.scenarios.DatasetParams
          _convert_: all
          dataset_name: db_jpntaxigen2_v2
          max_past_sweeps: 2
          max_future_sweeps: 0
          sample_steps: 1

datamodule:
  streaming: true
  train_sources:
    - database: ${database}
      det3d: true
      seg3d: true
      repeat: 1
    - database: ${jpntaxi_database}
      det3d: true
      seg3d: true
      repeat: 1
  validation_sources:
    - database: ${database}
      det3d: true
      seg3d: true
      repeat: 1
  test_sources:
    - database: ${database}
      det3d: true
      seg3d: true
      repeat: 1
  train_dataset:
    transforms:
      _target_: autoware_ml.transforms.base.TransformsCompose
      _convert_: all
      # Mild augmentation and no min-points filter, the instance bank carries occluded boxes
      pipeline:
        - _target_: autoware_ml.transforms.point_cloud.loading.LoadPointsFromFile
          _convert_: all
          use_dim: [0, 1, 2, 3]
          bev_remove_radius: 0.0
        - _target_: autoware_ml.transforms.point_cloud.geometry.GlobalRotScaleTrans
          _convert_: all
          yaw_rot_range: [-0.3925, 0.3925]
          scale_ratio_range: [0.95, 1.05]
          translation_std: [0.2, 0.2, 0.1]
        - _target_: autoware_ml.transforms.point_cloud.perturbation.RandomJitter
          _convert_: all
          sigma: 0.012
          clip: 0.05
        - _target_: autoware_ml.transforms.point_cloud.geometry.PointsRangeFilter
          _convert_: all
          points_range: ${point_cloud_range}
        # Milder dropout keeps the few points of thin objects such as riders and two-wheelers
        - _target_: autoware_ml.transforms.point_cloud.sampling.RandomDropout
          _convert_: all
          probability: 0.25
          dropout_ratio: 0.1
        - _target_: autoware_ml.transforms.point_cloud.perturbation.RandomStrengthJitter
          _convert_: all
          gamma_range: [0.8, 1.25]
          scale_range: [0.9, 1.1]
          shift_range: [-0.02, 0.02]
        - _target_: autoware_ml.transforms.boxes3d.filters.BBoxesLabelNameFilter
          _convert_: all
          label_names_to_keep: ${database.taxonomy.detection3d.class_names}
          class_names: ${database.taxonomy.detection3d.class_names}
        - _target_: autoware_ml.transforms.boxes3d.filters.BBoxesAttributeFilter
          _convert_: all
          filter_attributes: ${dataset.detection3d.filter_attributes}
        - _target_: autoware_ml.transforms.boxes3d.filters.BBoxesRangeFilter
          _convert_: all
          point_cloud_range: ${point_cloud_range}
        # Point counts of the served frame, they decide when an instance is observed
        - _target_: autoware_ml.transforms.boxes3d.filters.BBoxesPointCount
  test_dataset:
    transforms:
      _target_: autoware_ml.transforms.base.TransformsCompose
      _convert_: all
      pipeline:
        - _target_: autoware_ml.transforms.point_cloud.loading.LoadPointsFromFile
          _convert_: all
          use_dim: [0, 1, 2, 3]
          bev_remove_radius: 0.0
        - _target_: autoware_ml.transforms.point_cloud.geometry.PointsRangeFilter
          _convert_: all
          points_range: ${point_cloud_range}
        - _target_: autoware_ml.transforms.boxes3d.filters.BBoxesLabelNameFilter
          _convert_: all
          label_names_to_keep: ${database.taxonomy.detection3d.class_names}
          class_names: ${database.taxonomy.detection3d.class_names}
        - _target_: autoware_ml.transforms.boxes3d.filters.BBoxesAttributeFilter
          _convert_: all
          filter_attributes: ${dataset.detection3d.filter_attributes}
        - _target_: autoware_ml.transforms.boxes3d.filters.BBoxesRangeFilter
          _convert_: all
          point_cloud_range: ${point_cloud_range}
        # Point counts of the served frame, they decide when an instance is observed
        - _target_: autoware_ml.transforms.boxes3d.filters.BBoxesPointCount
  # 20 s train streams, 4 s val streams to fill 16 GPUs x 8 lanes, whole test scenarios
  train_dataloader:
    batch_size: ${batch_size}
    num_workers: ${num_workers}
    shuffle: false
    stream_max_frames: 200
  validation_dataloader:
    batch_size: ${batch_size}
    num_workers: ${num_workers}
    shuffle: false
    stream_max_frames: 40
  test_dataloader:
    batch_size: ${batch_size}
    num_workers: ${num_workers}
    shuffle: false

model:
  det_fusion:
    stage_channels:
      - ${model.encoder.enc_channels[1]}
      - ${model.encoder.enc_channels[2]}
      - ${model.encoder.enc_channels[3]}
      - ${model.encoder.enc_channels[4]}
  voxel_encoder:
    _target_: autoware_ml.models.segmentation3d.encoders.voxel.MeanVoxelFeatureEncoder
  encoder:
    in_channels: 4
  bbox_head:
    anchor_file: ${cache_root_path}/sparse4d_anchors/t4dataset_pseudo_10hz_j6gen2_jpntaxigen2_${num_anchor}.npy
    num_temp_instances: 1200
    num_output: 500
    default_time_interval: 0.1
    max_time_interval: 2.0
    # Sparse4D decays by 0.6 per frame at 2 Hz, about 0.36 per second
    confidence_decay: 0.36
    dn_query_budget: 400
    class_names: ${dataset.detection3d.class_names}
    # An instance becomes a target once it holds 2 points in a frame of the stream
    min_observed_points: 2
    track_birth_score: 0.2
    # A rider boxed as a pedestrian is suppressed by its two-wheeler
    nms_groups:
      - class_names: [motorcycle, bicycle, pedestrian]
        nms_radius: 0.5
        post_max_size: ${model.bbox_head.num_output}
  # Peaks of 2e-4 for the head and 1e-4 for the encoder, sized for 8 GPUs x 8 lanes
  optimizer:
    lr: 0.00004
  optimizer_group_overrides:
    encoder_block:
      lr: 0.000008
    encoder_default:
      lr: 0.00002
    seg3d_head:
      lr: 0.00002
  # Per-step warmup over 2 epochs, then cosine decay over 22 epochs of 2004 steps
  scheduler:
    warmup_epochs: 4008
    decay_epochs: 44088
    max_lr_factor: 5.0
  scheduler_config:
    interval: step
  metrics: ${merge_lists:${dataset.segdet3d.metrics},${tracking_metrics}}

# Detection on the boxes observed in the stream so far, and the tracks
tracking_metrics:
  - _target_: autoware_ml.metrics.detection3d.suite.Detection3DMetricSuite
    prefix: det3d_observed
    components: ${dataset.detection3d.detection_components}
    class_names: ${dataset.detection3d.class_names}
    observed_only: true
    eval_class_range: ${dataset.detection3d.eval_class_range}
    ranges: ${dataset.detection3d.metric_ranges}
  - _target_: autoware_ml.metrics.detection3d.tracking.TrackingMetricSuite
    components:
      - _target_: autoware_ml.metrics.detection3d.tracking.TrackingSummary
    class_names: ${dataset.detection3d.class_names}
    score_threshold: ${model.bbox_head.track_birth_score}
    sweep_score_thresholds: [0.3, 0.4, 0.5, 0.6]
    match_distance: 2.0

trainer:
  max_epochs: 24
  # The streaming sampler shards the ranks itself
  use_distributed_sampler: false

callbacks:
  early_stopping: null
  gradient_norm:
    _target_: autoware_ml.callbacks.gradient_norm.GradientNormMonitor

# The det head graph takes the instance bank state of the last frame and returns the next one
deploy:
  onnx:
    enabled: true
    opset_version: 17
    dynamo: false
    do_constant_folding: false
    modules:
      ptv3_encoder:
        output_names: [point_feat_0, point_feat_1, point_feat_2, point_feat_3, point_feat_4]
        metainfo:
          point_cloud_range: ${point_cloud_range}
          voxel_size: ["${grid_size}", "${grid_size}", "${grid_size}"]
          serialization_orders: [z, z-trans]
          pooling_strides: ${model.encoder.stride}
          enc_channels: ${model.encoder.enc_channels}
          patch_sizes: ${model.encoder.enc_patch_size}
      ptv3_seg3d_head:
        output_names: [pred_labels, pred_probs]
        metainfo:
          dec_depths: ${model.seg3d_head.dec_depths}
          class_names: ${dataset.segmentation3d.class_names}
      ptv3_det3d_head:
        output_names:
          [
            classification,
            prediction,
            quality,
            temp_instance_feature_out,
            temp_anchor_out,
            temp_confidence_out,
            temp_query_index_out,
          ]
        metainfo:
          class_names: ${dataset.detection3d.class_names}
          box_layout: [x, y, z, ln_l, ln_w, ln_h, sin_yaw, cos_yaw, vx, vy]
          quality_layout: [centerness, yawness]
          num_anchor: ${num_anchor}
          embed_dims: ${model.bbox_head.embed_dims}
          num_output: ${model.bbox_head.num_output}
          num_temp_instances: ${model.bbox_head.num_temp_instances}
          default_time_interval: ${model.bbox_head.default_time_interval}
          max_time_interval: ${model.bbox_head.max_time_interval}
          confidence_decay: ${model.bbox_head.confidence_decay}
          track_birth_score: ${model.bbox_head.track_birth_score}
          nms_groups: ${model.bbox_head.nms_groups}
  tensorrt:
    enabled: false
