# @package _global_

# Stage 2 of the voxel005 teacher pipeline (seg3d -> THIS -> j6gen2 base
# pseudo -> j6gen2 joint): pretrain on the 120k mixed-ODD base set (det3d GT +
# pseudo seg3d) with the j6gen2 seg3d GT frames rehearsed in (det loss masked).
# Inherits the architecture, geometry, precision, and the offline taxonomy from
# the j6gen2 joint voxel005 config; the rehearsal database is bound to the same
# level and pipelines, since every database of a datamodule must share one
# taxonomy. Schedule and encoder-group learning rates mirror the voxel012 base
# pseudo stage (initialized from the stage-1 seg3d voxel005 checkpoint; the
# from-scratch det branch caps at max_lr_factor 5, the inherited 10 diverged).

defaults:
  - /tasks/multi/ptv3/voxel005_122m_t4dataset_j6gen2
  - /database@rehearsal_database: t4dataset/t4dataset_j6gen2_semaseg
  - override /database/t4dataset/taxonomy@rehearsal_database.taxonomy: offline
  - override /database/t4dataset/box3d_pipelines@rehearsal_database.box3d_pipelines: trailer_class_box3d_pipelines
  - override /database@database: t4dataset/t4dataset_base_pseudo
  - _self_

datamodule:
  # Training mixes the pseudo corpus with the rehearsed seg3d GT frames.
  # Validation and test score detection on the pseudo corpus boxes and
  # segmentation on the GT masks only, each frame once.
  train_sources:
    - database: ${database}
      det3d: true
      seg3d: true
      repeat: 1
    - database: ${rehearsal_database}
      det3d: false
      seg3d: true
      repeat: 6
  val_sources:
    - database: ${database}
      det3d: true
      seg3d: false
      repeat: 1
    - database: ${rehearsal_database}
      det3d: false
      seg3d: true
      repeat: 1
  test_sources: ${datamodule.val_sources}

model:
  optimizer_group_overrides:
    encoder_block:
      lr: 0.00001
    encoder_default:
      lr: 0.000025
    seg3d_head:
      lr: 0.00005
  scheduler:
    warmup_epochs: 2
    decay_epochs: 22
    max_lr_factor: 5.0

trainer:
  max_epochs: 24

callbacks:
  early_stopping:
    patience: 8
