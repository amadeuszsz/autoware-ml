# @package _global_

# Stage 2 of the seg3d-preserving pipeline (joint-training-issue.md): pretrain
# on the 120k mixed-ODD base set (det3d GT + pseudo seg3d) with the 4k j6gen2
# seg3d GT frames rehearsed in (det loss masked). The schedule is shorter and
# the encoder groups cooler than the joint stage: this stage only pretrains
# features that stage 3 consumes, and every epoch here is 2x the optimizer
# steps of a 60k-frame epoch.

defaults:
  - /tasks/multi/ptv3/voxel012_122m_t4dataset_j6gen2
  - /database@rehearsal_database: t4dataset/t4dataset_j6gen2_semaseg
  - override /database@database: t4dataset/t4dataset_base_pseudo
  - _self_

# The auto-label generator writes canonical-style category names into the
# pseudo masks (driveable_flat, non_driveable_flat, vehicle_extension, ignored,
# ...). Those names are absorbed by the base t4 segmentation3d name_mapping, so
# this stage needs no per-config class remapping. It inherits the derived
# class_mapping and behaviour groups unchanged.

datamodule:
  # Training mixes the pseudo corpus with the rehearsed seg3d GT frames.
  # Validation and test score detection on the pseudo corpus boxes and
  # segmentation on the GT masks only, each frame once.
  train_sources:
    - database: ${database}
      det3d: true
      seg3d: true
      repeat: 1
    - database: ${rehearsal_database}
      det3d: false
      seg3d: true
      repeat: 6
  val_sources:
    - database: ${database}
      det3d: true
      seg3d: false
      repeat: 1
    - database: ${rehearsal_database}
      det3d: false
      seg3d: true
      repeat: 1
  test_sources: ${datamodule.val_sources}

model:
  optimizer_group_overrides:
    encoder_block:
      lr: 0.00001
    encoder_default:
      lr: 0.000025
    seg3d_head:
      lr: 0.00005
  scheduler:
    warmup_epochs: 2
    decay_epochs: 22
    # The inherited 10.0 peaked the from-scratch det branch at 1e-3 and the
    # run diverged into NaN while still ramping (4.3e-4); cap like stage 3.
    max_lr_factor: 5.0

trainer:
  max_epochs: 24

callbacks:
  early_stopping:
    patience: 8
