# @package _global_

# Teacher variant of the joint model on the 6 cm grid with the fine taxonomy, never deployed

defaults:
  - /tasks/multi/ptv3/voxel012_122m_t4dataset_j6gen2
  - override /database/t4dataset/box3d_pipelines@database.box3d_pipelines: trailer_class_box3d_pipelines
  - override /database/t4dataset/taxonomy@database.taxonomy: default_fine
  - override /datamodule/transforms@datamodule.train_dataset.transforms: voxel006_segdet3d_train_transforms
  - _self_

# Pedestrian subtypes of the fine taxonomy
partial_detection_classes:
  [motorcycle, bicycle, pedestrian.common, pedestrian.personal_mobility,
   pedestrian.stroller, traffic_cone]

grid_size: 0.06
max_voxels: 1048576
head_voxel_size: [0.48, 0.48, 8.0]

batch_size: 1

model:
  # PT-v3m3 encoder and segmentation decoder, checkpoint compatible with the seg3d stage
  encoder:
    enc_depths: [3, 3, 3, 12, 3]
    enc_channels: [54, 108, 216, 432, 576]
    enc_num_head: [3, 6, 12, 24, 32]
    enc_patch_size: [1024, 1024, 1024, 1024, 1024]
  seg3d_head:
    dec_depths: [2, 2, 2, 2]
    dec_channels: [54, 108, 216, 432]
    dec_num_head: [3, 6, 12, 24]
    dec_patch_size: [1024, 1024, 1024, 1024]
  bev_neck:
    # Wider detection branch than the deployed model, the teacher has no latency budget
    fusion:
      out_channels: 512
    bev_projector:
      out_channels: 256
      output_shape: [512, 512]
    bev_encoder:
      hidden_channels: 256
      out_channels: 256
      # Dilations doubled with the halved BEV cell so the receptive field keeps its radius
      dilations: [2, 4, 10, 4]
  bbox_head:
    in_channels: 256
    hidden_channel: 256
    feedforward_channels: 512
    # Large vehicle subtypes of the fine taxonomy
    dense_heatmap_pooling_classes:
      [car.common, car.emergency, car.special, truck.common, truck.emergency, truck.trailer,
       truck.construction, bus]
    # 2.4 m window at the halved BEV cell
    nms_kernel_size: 5
    # Large vehicles suppress each other, the remaining classes take per class top-k caps
    nms_groups:
      - class_names:
          [car.common, car.emergency, car.special, truck.common, truck.emergency, truck.trailer,
           truck.construction, bus, train]
        nms_radius: 0.25
        post_max_size: 300
      - class_names: [motorcycle, bicycle]
        nms_radius: 0.5
        post_max_size: 100
      - class_names: [pedestrian.common]
        nms_radius: 0.0
        post_max_size: 100
      - class_names: [pedestrian.personal_mobility]
        nms_radius: 0.0
        post_max_size: 50
      - class_names: [pedestrian.stroller]
        nms_radius: 0.0
        post_max_size: 50
      - class_names: [animal]
        nms_radius: 0.0
        post_max_size: 50
      - class_names: [barrier.movable]
        nms_radius: 0.0
        post_max_size: 50
      - class_names: [barrier.construction_sign]
        nms_radius: 0.0
        post_max_size: 50
      - class_names: [traffic_cone]
        nms_radius: 0.0
        post_max_size: 100
      - class_names: [debris.unclassified]
        nms_radius: 0.0
        post_max_size: 50
      - class_names: [debris.pushable_pullable]
        nms_radius: 0.0
        post_max_size: 50
    bbox_coder:
      # The teacher decodes everything, no per class score threshold
      score_threshold: 0.0

trainer:
  precision: 32-true
  accumulate_grad_batches: 8
  # BatchNorm statistics pooled across ranks, one scene per GPU is too few
  sync_batchnorm: true
