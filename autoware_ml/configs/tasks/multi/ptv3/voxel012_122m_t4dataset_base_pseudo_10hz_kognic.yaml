# @package _global_

# Stage 3: joint training on the 10 Hz pseudo labels with the Kognic pre-delivery boxes and masks

defaults:
  - /tasks/multi/ptv3/voxel012_122m_t4dataset_base_pseudo_10hz
  - override /database@joint_database: t4dataset/t4dataset_j6gen2_segdet3d_kognic
  - _self_

datamodule:
  train_sources:
    - database: ${database}
      det3d: true
      seg3d: true
      repeat: 1
    - database: ${jpntaxi_database}
      det3d: true
      seg3d: true
      repeat: 1
    - database: ${joint_database}
      det3d: true
      seg3d: true
      repeat: 6
