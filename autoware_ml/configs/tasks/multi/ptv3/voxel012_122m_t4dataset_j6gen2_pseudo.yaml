# @package _global_

# Stage 3, joint training on the pseudo labelled J6 gen2 set

defaults:
  - /tasks/multi/ptv3/voxel012_122m_t4dataset_j6gen2
  - /database@seg3d_gt_database: t4dataset/t4dataset_j6gen2_semaseg
  - override /database@database: t4dataset/t4dataset_j6gen2_pseudo
  - _self_

datamodule:
  # Validation scores det3d on the pseudo boxes and seg3d on the GT masks
  train_sources:
    - database: ${database}
      det3d: true
      seg3d: true
      repeat: 1
    - database: ${seg3d_gt_database}
      det3d: false
      seg3d: true
      repeat: 6
  val_sources:
    - database: ${database}
      det3d: true
      seg3d: false
      repeat: 1
    - database: ${seg3d_gt_database}
      det3d: false
      seg3d: true
      repeat: 1
  test_sources: ${datamodule.val_sources}

model:
  # Both branches arrive trained from stage 2, every group sits below the stage 2 rates
  optimizer_group_overrides:
    encoder_block:
      lr: 0.00001
    encoder_default:
      lr: 0.000025
    seg3d_head:
      lr: 0.000025
  scheduler:
    warmup_epochs: 1
    # Warmup plus decay covers max_epochs
    decay_epochs: 15
    max_lr_factor: 2.0

trainer:
  max_epochs: 16

callbacks:
  early_stopping: null
