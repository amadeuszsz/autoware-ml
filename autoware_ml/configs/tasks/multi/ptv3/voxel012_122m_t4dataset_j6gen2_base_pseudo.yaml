# @package _global_

# Stage 3 of the seg3d-preserving pipeline (joint-training-issue.md): joint
# training on the 60k j6gen2 base set (det3d GT + pseudo seg3d) with the 4k
# j6gen2 seg3d GT frames rehearsed in (det loss masked). Initialized from the
# stage-2 checkpoint, so the det branch is no longer random: warmup shrinks and
# the total schedule is shorter than a from-scratch joint run.

defaults:
  - /tasks/multi/ptv3/voxel012_122m_t4dataset_j6gen2
  - /database@rehearsal_database: t4dataset/t4dataset_j6gen2_semaseg
  - override /database@database: t4dataset/t4dataset_j6gen2_base_pseudo
  - _self_

# The auto-label generator writes canonical-style category names into the
# pseudo masks (driveable_flat, non_driveable_flat, vehicle_extension, ignored,
# ...). Those names are absorbed by the segmentation vocabulary of the database
# taxonomy, so this stage needs no per-config class remapping and inherits the
# online taxonomy and the behaviour groups unchanged.

datamodule:
  # Training mixes the pseudo corpus with the rehearsed seg3d GT frames.
  # Validation and test score detection on the pseudo corpus boxes and
  # segmentation on the GT masks only, each frame once.
  train_sources:
    - database: ${database}
      det3d: true
      seg3d: true
      repeat: 1
    - database: ${rehearsal_database}
      det3d: false
      seg3d: true
      repeat: 6
  val_sources:
    - database: ${database}
      det3d: true
      seg3d: false
      repeat: 1
    - database: ${rehearsal_database}
      det3d: false
      seg3d: true
      repeat: 1
  test_sources: ${datamodule.val_sources}

model:
  scheduler:
    warmup_epochs: 4
    decay_epochs: 36
    max_lr_factor: 5.0

trainer:
  max_epochs: 40

callbacks:
  early_stopping:
    patience: 40
