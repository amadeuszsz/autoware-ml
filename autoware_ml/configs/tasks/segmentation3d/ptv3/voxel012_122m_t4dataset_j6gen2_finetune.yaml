# @package _global_

# Finetune the segmentation decoder head (unpooling stages + classifier)
# with the encoder frozen. The detection branch taps the encoder only, so
# this run cannot change detection outputs and the resulting checkpoint stays
# stackable with a detection checkpoint for deployment. The reduced OneCycle
# peak assumes the decoder and classifier are initialized from a trained
# checkpoint rather than from scratch.

defaults:
  - /tasks/segmentation3d/ptv3/voxel012_122m_t4dataset_j6gen2
  - _self_

model:
  freeze_encoder: true
  scheduler:
    max_lr: [0.0005, 0.00005]
    pct_start: 0.1

trainer:
  max_epochs: 30
