# Every human labelled T4dataset detection database. The taxonomy comes from the dataset
# config, so training and generation resolve the same classes.
_target_: autoware_ml.databases.t4dataset.t4database.T4Database
_convert_: all

defaults:
  - /database/t4dataset/box3d_pipelines@box3d_pipelines: default_box3d_pipelines
  - /database/t4dataset/scenarios@scenarios.db_base: detection3d/db_base
  - /database/t4dataset/scenarios@scenarios.db_j6gen2_base: detection3d/db_j6gen2_base
  - /database/t4dataset/scenarios@scenarios.db_j6gen2: detection3d/db_j6gen2
  - /database/t4dataset/scenarios@scenarios.db_jpntaxi_base: detection3d/db_jpntaxi_base
  - /database/t4dataset/scenarios@scenarios.db_largebus: detection3d/db_largebus

version: T4Dataset-base-v1.0.0
# Root path of actual annotation files
root_path: ${data_root_path}/t4dataset/

# Record table, it will be <cache_path>/<cache_file_prefix_name>_<database_hash>.parquet
cache_path: ${cache_root_path}/t4dataset/
cache_file_prefix_name: database

# Processor settings
num_workers: 16

# Sensor channel of the lidar frame every sample is built around
lidar_channel: LIDAR_CONCAT

# Taxonomy the box labels are resolved against
class_names: ${t4dataset.detection3d.class_names}
label_remapper: ${t4dataset.detection3d.name_mapping}
ignore_label_index: -1
