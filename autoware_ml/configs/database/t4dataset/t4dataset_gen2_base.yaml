# Every gen2 sensor layout database: JPN taxi gen2, J6 gen2 and the large bus releases.
_target_: autoware_ml.databases.t4dataset.t4database.T4Database
_convert_: all

defaults:
  - /database/t4dataset/taxonomy@taxonomy: online
  - /database/t4dataset/box3d_pipelines@box3d_pipelines: default_box3d_pipelines
  - /database/t4dataset/scenarios@scenarios.db_gen2_base: detection3d/db_gen2_base

version: T4Dataset-gen2_base-v1.0.0
# Root path of actual annotation files
root_path: ${data_root_path}/t4dataset/

# Record table, it will be <cache_path>/<cache_file_prefix_name>_<database_hash>.parquet
cache_path: ${cache_root_path}/t4dataset/
cache_file_prefix_name: database

# Processor settings
num_workers: 16

# Sensor channel of the lidar frame every sample is built around
lidar_channel: LIDAR_CONCAT
