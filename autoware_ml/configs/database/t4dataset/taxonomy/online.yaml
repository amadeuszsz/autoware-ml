# Online taxonomy of T4dataset: the classes the deployed models train. Every fine label of the
# vocabularies folds onto one class or is dropped with null. Boxes are baked with these class
# indices and the fine name, masks are resolved through the same tables when they are loaded.
_target_: autoware_ml.databases.taxonomy.DatabaseTaxonomy
_convert_: all

defaults:
  - /database/t4dataset/taxonomy/vocabulary@detection3d.vocabulary: detection3d
  - /database/t4dataset/taxonomy/vocabulary@segmentation3d.vocabulary: segmentation3d
  - _self_

detection3d:
  _target_: autoware_ml.databases.taxonomy.DetectionTaxonomy
  ignore_index: -1
  class_groups:
    grouped_vehicle: [car, truck, bus, train, vehicle_extension]
    grouped_two_wheeler: [motorcycle, bicycle]
    grouped_pedestrian_animal: [pedestrian, animal]
    grouped_static_obstacle: [barrier, traffic_cone]
    grouped_debris: [debris]
    grouped_structure: [bicycle_rack]
  eval_range:
    car: 121.0
    truck: 121.0
    bus: 121.0
    train: 121.0
    motorcycle: 121.0
    bicycle: 121.0
    pedestrian: 121.0
    animal: 121.0
    barrier: 121.0
    traffic_cone: 121.0
    debris: 121.0
    bicycle_rack: 121.0
    vehicle_extension: 121.0
  collision_kinds:
    car: wheeled
    truck: wheeled
    bus: wheeled
    train: wheeled
    motorcycle: wheeled
    bicycle: vru
    pedestrian: vru
    animal: vru
    barrier: static
    traffic_cone: static
    debris: static
    bicycle_rack: static
    vehicle_extension: static
  vru_speeds:
    pedestrian: 3.0
    animal: 4.0
    bicycle: 6.0
  class_names:
    - car
    - truck
    - bus
    - train
    - motorcycle
    - bicycle
    - pedestrian
    - animal
    - barrier
    - traffic_cone
    - debris
    - bicycle_rack
    - vehicle_extension
  coarsening:
    car: car
    other_vehicle: car
    emergency_vehicle: car
    forklift: car
    truck: truck
    construction_vehicle: truck
    # A trailer attached to a truck is merged into the truck box by the pipelines, a trailer
    # on its own is an obstacle the size of a truck and trains as one
    trailer: truck
    bus: bus
    train: train
    motorcycle: motorcycle
    bicycle: bicycle
    pedestrian: pedestrian
    personal_mobility: pedestrian
    animal: animal
    barrier: barrier
    construction_sign: barrier
    traffic_cone: traffic_cone
    debris: debris
    pushable_pullable: debris
    bicycle_rack: bicycle_rack
    open_door: vehicle_extension
    vehicle_protruding_object: vehicle_extension

segmentation3d:
  _target_: autoware_ml.databases.taxonomy.SegmentationTaxonomy
  ignore_index: -1
  class_groups:
    grouped_vehicle: [car, truck, bus, train, vehicle_extension]
    grouped_two_wheeler: [motorcycle, bicycle]
    grouped_pedestrian_animal: [pedestrian, animal]
    grouped_static_obstacle: [barrier, traffic_cone]
    grouped_debris: [debris]
    grouped_static_clutter: [static_clutter]
    grouped_flat: [drivable_flat, non_drivable_flat]
    grouped_vegetation: [vegetation]
    grouped_structure: [building, vertical_thin, bicycle_rack]
    grouped_noise: [noise]
  # The detection classes come first, in the same order, so a detection class and its
  # segmentation class share one index
  class_names:
    - car
    - truck
    - bus
    - train
    - motorcycle
    - bicycle
    - pedestrian
    - animal
    - barrier
    - traffic_cone
    - debris
    - bicycle_rack
    - vehicle_extension
    - drivable_flat
    - non_drivable_flat
    - vegetation
    - building
    - vertical_thin
    - static_clutter
    - noise
  coarsening:
    car: car
    emergency_vehicle: car
    forklift: car
    other_vehicle: car
    fire_truck: truck
    ambulance: car
    police_car: car
    kart: car
    truck: truck
    construction_vehicle: truck
    trailer: truck
    bus: bus
    train: train
    motorcycle: motorcycle
    bicycle: bicycle
    pedestrian: pedestrian
    personal_mobility: pedestrian
    stroller: pedestrian
    animal: animal
    barrier: barrier
    construction_sign: barrier
    traffic_cone: traffic_cone
    debris: debris
    pushable_pullable: debris
    bicycle_rack: bicycle_rack
    open_door: vehicle_extension
    vehicle_protruding_object: vehicle_extension
    solid_stuff: static_clutter
    other_stuff: static_clutter
    drivable_surface: drivable_flat
    drainage: drivable_flat
    sidewalk: non_drivable_flat
    other_flat_surface: non_drivable_flat
    high_curb: non_drivable_flat
    low_curb: non_drivable_flat
    vegetation: vegetation
    building: building
    pole: vertical_thin
    bollard: vertical_thin
    traffic_light: vertical_thin
    traffic_sign: vertical_thin
    flag: vertical_thin
    noise: noise
    ghost_point: noise
    background: null
    ego_vehicle: null
    out_of_sync: null
