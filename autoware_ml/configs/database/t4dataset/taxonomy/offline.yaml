# Offline taxonomy of T4dataset: the fine labels of the vocabularies trained as classes of
# their own by the teacher models used for pseudo labeling and distillation, never deployed.
# The coarsening is the identity, so every table baked with it keeps a trailer as a box of its
# own and the databases bind it together with the pipelines that do not merge trailers.
_target_: autoware_ml.databases.taxonomy.DatabaseTaxonomy
_convert_: all

defaults:
  - /database/t4dataset/taxonomy/vocabulary@detection3d.vocabulary: detection3d
  - /database/t4dataset/taxonomy/vocabulary@segmentation3d.vocabulary: segmentation3d
  - _self_

detection3d:
  _target_: autoware_ml.databases.taxonomy.DetectionTaxonomy
  ignore_index: -1
  class_groups:
    grouped_vehicle:
      [car, truck, trailer, bus, train, construction_vehicle, emergency_vehicle, forklift,
       other_vehicle, open_door, vehicle_protruding_object]
    grouped_two_wheeler: [motorcycle, bicycle]
    grouped_pedestrian_animal: [pedestrian, personal_mobility, animal]
    grouped_static_obstacle: [barrier, construction_sign, traffic_cone]
    grouped_debris: [debris, pushable_pullable]
    grouped_structure: [bicycle_rack]
  eval_range:
    car: 121.0
    truck: 121.0
    trailer: 121.0
    bus: 121.0
    train: 121.0
    construction_vehicle: 121.0
    emergency_vehicle: 121.0
    forklift: 121.0
    other_vehicle: 121.0
    motorcycle: 121.0
    bicycle: 121.0
    pedestrian: 121.0
    personal_mobility: 121.0
    animal: 121.0
    barrier: 121.0
    construction_sign: 121.0
    traffic_cone: 121.0
    debris: 121.0
    pushable_pullable: 121.0
    bicycle_rack: 121.0
    open_door: 121.0
    vehicle_protruding_object: 121.0
  collision_kinds:
    car: wheeled
    truck: wheeled
    trailer: wheeled
    bus: wheeled
    train: wheeled
    construction_vehicle: wheeled
    emergency_vehicle: wheeled
    forklift: wheeled
    other_vehicle: wheeled
    motorcycle: wheeled
    bicycle: vru
    pedestrian: vru
    personal_mobility: vru
    animal: vru
    barrier: static
    construction_sign: static
    traffic_cone: static
    debris: static
    pushable_pullable: static
    bicycle_rack: static
    open_door: static
    vehicle_protruding_object: static
  vru_speeds:
    pedestrian: 3.0
    animal: 4.0
    bicycle: 6.0
    personal_mobility: 6.0
  class_names:
    - car
    - truck
    - trailer
    - bus
    - train
    - construction_vehicle
    - emergency_vehicle
    - forklift
    - other_vehicle
    - motorcycle
    - bicycle
    - pedestrian
    - personal_mobility
    - animal
    - barrier
    - construction_sign
    - traffic_cone
    - debris
    - pushable_pullable
    - bicycle_rack
    - open_door
    - vehicle_protruding_object
  coarsening:
    car: car
    truck: truck
    trailer: trailer
    bus: bus
    train: train
    construction_vehicle: construction_vehicle
    emergency_vehicle: emergency_vehicle
    forklift: forklift
    other_vehicle: other_vehicle
    motorcycle: motorcycle
    bicycle: bicycle
    pedestrian: pedestrian
    personal_mobility: personal_mobility
    animal: animal
    barrier: barrier
    construction_sign: construction_sign
    traffic_cone: traffic_cone
    debris: debris
    pushable_pullable: pushable_pullable
    bicycle_rack: bicycle_rack
    open_door: open_door
    vehicle_protruding_object: vehicle_protruding_object

segmentation3d:
  _target_: autoware_ml.databases.taxonomy.SegmentationTaxonomy
  ignore_index: -1
  class_groups:
    grouped_vehicle:
      [car, truck, trailer, bus, train, construction_vehicle, fire_truck, ambulance, police_car,
       emergency_vehicle, forklift, kart, other_vehicle, open_door, vehicle_protruding_object]
    grouped_two_wheeler: [motorcycle, bicycle]
    grouped_pedestrian_animal: [pedestrian, personal_mobility, stroller, animal]
    grouped_static_obstacle: [barrier, construction_sign, traffic_cone]
    grouped_debris: [debris, pushable_pullable]
    grouped_static_clutter: [solid_stuff, other_stuff]
    grouped_flat: [drivable_surface, drainage, sidewalk, other_flat_surface, high_curb, low_curb]
    grouped_vegetation: [vegetation]
    grouped_structure: [building, pole, bollard, traffic_light, traffic_sign, flag, bicycle_rack]
    grouped_noise: [noise, ghost_point]
    grouped_marker: [background, ego_vehicle, out_of_sync]
  # The detection classes come first, in the same order, so a detection class and its
  # segmentation class share one index. The annotation markers are trained as they are.
  class_names:
    - car
    - truck
    - trailer
    - bus
    - train
    - construction_vehicle
    - emergency_vehicle
    - forklift
    - other_vehicle
    - motorcycle
    - bicycle
    - pedestrian
    - personal_mobility
    - animal
    - barrier
    - construction_sign
    - traffic_cone
    - debris
