    - bicycle_rack
    - open_door
    - vehicle_protruding_object
    - fire_truck
    - ambulance
    - police_car
    - kart
    - stroller
    - solid_stuff
    - other_stuff
    - drivable_surface
    - drainage
    - sidewalk
    - other_flat_surface
    - high_curb
    - low_curb
    - vegetation
    - building
    - pole
    - bollard
    - traffic_light
    - traffic_sign
    - flag
    - noise
    - ghost_point
    - background
    - ego_vehicle
    - out_of_sync
  coarsening:
    car: car
    truck: truck
    trailer: trailer
    bus: bus
    train: train
    construction_vehicle: construction_vehicle
    emergency_vehicle: emergency_vehicle
    forklift: forklift
    other_vehicle: other_vehicle
    motorcycle: motorcycle
    bicycle: bicycle
    pedestrian: pedestrian
    personal_mobility: personal_mobility
    animal: animal
    barrier: barrier
    construction_sign: construction_sign
    traffic_cone: traffic_cone
    debris: debris
    pushable_pullable: pushable_pullable
    bicycle_rack: bicycle_rack
    open_door: open_door
    vehicle_protruding_object: vehicle_protruding_object
    fire_truck: fire_truck
    ambulance: ambulance
    police_car: police_car
    kart: kart
    stroller: stroller
    solid_stuff: solid_stuff
    other_stuff: other_stuff
    drivable_surface: drivable_surface
    drainage: drainage
    sidewalk: sidewalk
    other_flat_surface: other_flat_surface
    high_curb: high_curb
    low_curb: low_curb
    vegetation: vegetation
    building: building
    pole: pole
    bollard: bollard
    traffic_light: traffic_light
