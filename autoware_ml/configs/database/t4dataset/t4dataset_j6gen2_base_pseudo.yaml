# The pseudo labelled J6 gen2 base databases, the J6 gen2 and large bus releases. The masks
# are regenerated whenever the teacher changes, and the scenes live under pseudo_large, so
# they form a database of their own.
_target_: autoware_ml.databases.t4dataset.t4database.T4Database
_convert_: all

defaults:
  - /database/t4dataset/taxonomy@taxonomy: online
  - /database/t4dataset/box3d_pipelines@box3d_pipelines: default_box3d_pipelines
  - /database/t4dataset/scenarios@scenarios.db_j6gen2_base_pseudo: segmentation3d_pseudo/db_j6gen2_base_pseudo

version: T4Dataset-j6gen2_base_pseudo-v1.0.0
# Root path of actual annotation files
root_path: ${data_root_path}/t4dataset/pseudo_large/

# Record table, it will be <cache_path>/<cache_file_prefix_name>_<database_hash>.parquet
cache_path: ${cache_root_path}/t4dataset_pseudo/
cache_file_prefix_name: database

# Processor settings
num_workers: 16

# Sensor channel of the lidar frame every sample is built around
lidar_channel: LIDAR_CONCAT
