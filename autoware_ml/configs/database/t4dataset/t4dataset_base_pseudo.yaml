# The pseudo labelled T4dataset databases of the other platforms: the base corpus without the
# gen1 J6 and GSM8 releases, and without the J6 gen2 and large bus releases, which form a
# database of their own. The masks are regenerated whenever the teacher changes, and the scenes
# live under pseudo_large.
_target_: autoware_ml.databases.t4dataset.t4dataset.T4Dataset
_convert_: all

defaults:
  - t4dataset/taxonomy@taxonomy: default_coarse
  - t4dataset/box3d_pipelines@box3d_pipelines: default_box3d_pipelines
  - t4dataset/scenarios@scenarios.db_base_pseudo: detection3d_segmentation3d_pseudo/db_base_pseudo

version: T4Dataset-base_pseudo-v2.0.0
# Root path of actual annotation files
root_path: ${data_root_path}/t4dataset/pseudo_large/

# Caches
cache_path: ${cache_root_path}/t4dataset_pseudo/
# Prefix name of the cache file, it will be <cache_file_prefix_name>_<database_hash>.parquet
cache_file_prefix_name: database

# Processor settings
num_workers: 16

# Sensor channel of the lidar frame every sample is built around
lidar_channel: LIDAR_CONCAT

# The annotation directory of pseudo_large was rewritten with the coarse names of the auto
# label generator, the original tables next to it keep the fine box names the pipelines pair
box_annotation_dir: annotation_orig
