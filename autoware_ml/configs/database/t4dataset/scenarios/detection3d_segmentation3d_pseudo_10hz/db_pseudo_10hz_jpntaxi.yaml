_target_: autoware_ml.databases.t4dataset.t4scenarios.T4Scenarios
_convert_: all

# Root path where the scenario yaml files are stored
scenario_root_path: ${working_dir}/perception-devops/dataset_annotation/t4dataset/detection3d_segmentation3d_pseudo_10hz/

# List of dataset parameters, and dataset_name is the yaml file name in T4Dataset,
# which consists of train/val/test splits. Every lidar frame of a scene is a sample here,
# 100 ms apart, so two past sweeps reach 200 ms back.
dataset_params:
  - _target_: autoware_ml.databases.scenarios.DatasetParams
    _convert_: all
    dataset_name: db_jpntaxi_v1
    max_past_sweeps: 2
    max_future_sweeps: 0
    sample_steps: 1
    lidar_pointcloud_num_features: 5
    semantic_masks: true
  - _target_: autoware_ml.databases.scenarios.DatasetParams
    _convert_: all
    dataset_name: db_jpntaxigen2_v1
    max_past_sweeps: 2
    max_future_sweeps: 0
    sample_steps: 1
    lidar_pointcloud_num_features: 5
    semantic_masks: true
  - _target_: autoware_ml.databases.scenarios.DatasetParams
    _convert_: all
    dataset_name: db_jpntaxigen2_v2
    max_past_sweeps: 2
    max_future_sweeps: 0
    sample_steps: 1
    lidar_pointcloud_num_features: 5
    semantic_masks: true
