# @package _global_

# Root of the read only data mount the record paths resolve against. Record tables
# themselves live at a fixed /workspace/records, a separate writable mount, so the data
# mount can stay read only and every user can map their own records directory.
data_root_path: ${oc.env:AUTOWARE_ML_DATA_PATH}

datamodule:
  _target_: autoware_ml.datamodule.base.DataModule
  _convert_: all
  dataset: ???
  sources: ???
  train_dataloader_cfg:
    pin_memory: true
    persistent_workers: true
    drop_last: false
    shuffle: false
  val_dataloader_cfg:
    pin_memory: true
    persistent_workers: true
    drop_last: false
    shuffle: false
  test_dataloader_cfg:
    pin_memory: true
    persistent_workers: true
    drop_last: false
    shuffle: false
  predict_dataloader_cfg:
    pin_memory: true
    persistent_workers: true
    drop_last: false
    shuffle: false
  train_transforms:
    _target_: autoware_ml.transforms.base.TransformsCompose
  val_transforms:
    _target_: autoware_ml.transforms.base.TransformsCompose
  test_transforms:
    _target_: autoware_ml.transforms.base.TransformsCompose
  predict_transforms:
    _target_: autoware_ml.transforms.base.TransformsCompose
