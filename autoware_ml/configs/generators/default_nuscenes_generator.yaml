# @package _global_

hydra:
  run:
    dir: ${log_output_dir}
  output_subdir: code/hydra # Store hydra's config breakdown here for debugging

defaults:
  - /datasets/nuscenes/detection3d
  - /database@database: nuscenes/nuscenes_trainval
  - override /hydra/hydra_logging: none # Disable hydra's logging
  - _self_

# Directory structure
date_format: "%Y.%m.%d.%H.%M.%S"
experiment_uid: ${now:${date_format}} # Unique Id of the experiment, default to timestamp
log_output_dir: outputs/annotations/${experiment_uid}

# Root of the data mount the record paths resolve against
data_root_path: ${oc.env:AUTOWARE_ML_DATA_PATH}
# Writable mount the record tables are written to
cache_root_path: /workspace/records
