_target_: autoware_ml.datamodule.t4dataset.dataset.T4Dataset
_convert_: all
# The datamodule calls this factory once per dataset source of the split, with the root
# path, the records and the supervision of that source.
_partial_: true

defaults:
  - /datamodule/transforms@transforms: default_calibration_status_train_transforms

# The calibration status task reads no per-task ground truth, the misalignment augmentation
# writes the label onto the images
dataset_tasks: {}

# The calibration status task carries no bboxes, so no padding is needed
max_num_3d_gt_bboxes: 0
