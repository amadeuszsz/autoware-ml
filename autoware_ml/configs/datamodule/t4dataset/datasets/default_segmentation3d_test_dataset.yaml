_target_: autoware_ml.datamodule.t4dataset.dataset.T4Dataset
_convert_: all
# The datamodule calls this factory once per dataset source of the split, with the root
# path, the records and the supervision of that source.
_partial_: true

defaults:
  - segmentation3d@dataset_tasks.Segmentation3D: default_segmentation3d
  - /datamodule/transforms@transforms: default_segmentation3d_test_transforms

# 3D segmentation carries no bboxes, so no padding is needed
max_num_3d_gt_bboxes: 0
