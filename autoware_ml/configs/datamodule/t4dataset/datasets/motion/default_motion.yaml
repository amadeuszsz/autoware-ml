# Futures of the agents (6 s) at 0.5 s steps
_target_: autoware_ml.datamodule.common.motion.MotionTask
_convert_: all
_partial_: true

agent_steps: 12
step_seconds: 0.5
time_tolerance_seconds: 0.03
# A future farther than 50 m/s from the previous known position is an instance id switch
max_speed: 50.0
