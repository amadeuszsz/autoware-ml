_target_: autoware_ml.datamodule.data_module.DataModule
_convert_: all

defaults:
  - splitter: default_scenario_splitter
  - dataloader@train_dataloader: default_dataloader
  - dataloader@val_dataloader: default_dataloader
  - dataloader@test_dataloader: default_dataloader
  - dataloader@predict_dataloader: default_dataloader
  - t4dataset/datasets@train_dataset: default_detection3d_train_dataset
  - t4dataset/datasets@test_dataset: default_detection3d_test_dataset
  - t4dataset/datasets@val_dataset: default_detection3d_test_dataset

# Dataset sources of every split, several sources mix their corpora
train_sources:
  - database: ${database}
val_sources: ${datamodule.train_sources}
test_sources: ${datamodule.train_sources}

predict_sources: null
predict_dataset: null
