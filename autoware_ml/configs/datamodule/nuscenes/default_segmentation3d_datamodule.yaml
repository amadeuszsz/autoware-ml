_target_: autoware_ml.datamodule.data_module.DataModule
_convert_: all

defaults:
  - /datamodule/splitter@splitter: default_scenario_splitter
  - /datamodule/dataloader@train_dataloader: default_dataloader
  - /datamodule/dataloader@validation_dataloader: default_dataloader
  - /datamodule/dataloader@test_dataloader: default_dataloader
  - /datamodule/dataloader@predict_dataloader: default_dataloader
  - nuscenes/datasets@train_dataset: default_segmentation3d_train_dataset
  - nuscenes/datasets@test_dataset: default_segmentation3d_test_dataset
  - nuscenes/datasets@validation_dataset: default_segmentation3d_test_dataset

# Dataset sources of every split. A split naming several sources mixes their corpora,
# each with the supervision it contributes and the share of the epoch it takes.
train_sources:
  - database: ${database}
validation_sources: ${datamodule.train_sources}
test_sources: ${datamodule.train_sources}

predict_sources: null
predict_dataset: null
