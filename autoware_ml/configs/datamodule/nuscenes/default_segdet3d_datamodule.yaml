_target_: autoware_ml.datamodule.data_module.DataModule
_convert_: all

defaults:
  - /datamodule/splitter@splitter: default_scenario_splitter
  - /datamodule/dataloader@train_dataloader: default_dataloader
  - /datamodule/dataloader@val_dataloader: default_dataloader
  - /datamodule/dataloader@test_dataloader: default_dataloader
  - /datamodule/dataloader@predict_dataloader: default_dataloader
  - nuscenes/datasets@train_dataset: default_segdet3d_train_dataset
  - nuscenes/datasets@test_dataset: default_segdet3d_test_dataset
  - nuscenes/datasets@val_dataset: default_segdet3d_test_dataset

# Dataset sources of every split, several sources mix their corpora
train_sources:
  - database: ${database}
val_sources: ${datamodule.train_sources}
test_sources: ${datamodule.train_sources}

predict_sources: null
predict_dataset: null
