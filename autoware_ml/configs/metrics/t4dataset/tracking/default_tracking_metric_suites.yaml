# Tracking suites of the temporal detection models: detection on the boxes observed in the stream
# so far, then the tracks.
- _target_: autoware_ml.metrics.detection3d.suite.Detection3DMetricSuite
  prefix: det3d_observed
  components: ${metric_params.detection3d.components.detection3d_components}
  class_names: ${taxonomy.detection3d.class_names}
  observed_only: true
  max_distances: ${metric_params.detection3d.max_distances}
  collision: ${metric_params.detection3d.collision}
  ranges: ${metric_ranges}

- _target_: autoware_ml.metrics.detection3d.tracking.TrackingMetricSuite
  components:
    - _target_: autoware_ml.metrics.detection3d.tracking.TrackingSummary
      stages: [test]
  class_names: ${taxonomy.detection3d.class_names}
  score_threshold: ${model.bbox_head.track_birth_score}
  sweep_score_thresholds: [0.3, 0.4, 0.5, 0.6]
  match_distance: 2.0
  max_distances: ${metric_params.detection3d.max_distances}
